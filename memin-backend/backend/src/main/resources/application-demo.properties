# Local/demo profile: use a file-backed H2 database so records survive a backend
# restart. In deployment, mount a persistent volume at /app/data.
#
#   mvnw spring-boot:run -Dspring-boot.run.profiles=demo
#
# DemoDataInitializer creates the schema and applies the seed scripts only for a
# new database. schema.sql is intentionally skipped because it contains MySQL-only
# DDL (utf8mb4).
spring.datasource.url=jdbc:h2:file:${MMMS_DATA_DIR:/app/data}/mmms_db;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Use the project's hand-written schema (which the app targets in production) rather
# than Hibernate-generated DDL: the entity mappings add a UNIQUE index on the
# committee coordinator that the seed data intentionally violates (one coordinator
# runs several committees). schema-demo.sql is schema.sql minus the MySQL-only
# "CHARACTER SET utf8mb4" clauses that H2 rejects.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# DemoDataInitializer loads these scripts only when the file database is empty.
spring.sql.init.mode=never
spring.sql.init.schema-locations=
spring.sql.init.data-locations=

spring.h2.console.enabled=true
