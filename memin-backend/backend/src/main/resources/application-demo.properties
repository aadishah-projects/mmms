# Local demo profile: run the whole backend on an in-memory H2 database so the app
# can be started without a PostgreSQL/MySQL server.
#
#   mvnw spring-boot:run -Dspring-boot.run.profiles=demo
#
# Hibernate builds the schema from the entity mappings (ddl-auto=update), then the
# seed scripts are loaded (defer-datasource-initialization runs them AFTER Hibernate).
# schema.sql is intentionally skipped because it contains MySQL-only DDL (utf8mb4).
spring.datasource.url=jdbc:h2:mem:mmms_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Use the project's hand-written schema (which the app targets in production) rather
# than Hibernate-generated DDL: the entity mappings add a UNIQUE index on the
# committee coordinator that the seed data intentionally violates (one coordinator
# runs several committees). schema-demo.sql is schema.sql minus the MySQL-only
# "CHARACTER SET utf8mb4" clauses that H2 rejects.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-demo.sql
spring.sql.init.data-locations=classpath:data.sql,classpath:data-demo.sql

spring.h2.console.enabled=true
