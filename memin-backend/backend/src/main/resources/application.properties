spring.application.name=mmms-backend
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
# The frontend and backend use different HTTPS subdomains. Allow the browser
# to send the session cookie across those sites so authentication persists.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=none
llm.base-url=${LLM_BASE_URL:}
llm.provider-type=${LLM_PROVIDER_TYPE:}
llm.api-key=${LLM_API_KEY:}
llm.model=${LLM_MODEL:mimo-v2.5-pro}
llm.max-tokens=${LLM_MAX_TOKENS:2500}
# Store Java date/time values as epoch milliseconds in SQLite. This avoids the
# driver's single date-string format being applied to both LocalDate and
# LocalTime columns.
spring.datasource.url=${DATABASE_URL:jdbc:sqlite:mmms.db?date_class=INTEGER}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
# The SQLite database is persistent, so running the demo seed script on every
# startup tries to insert the same rows again and can prevent the application
# from starting. The isolated `demo` profile enables seeding explicitly.
spring.sql.init.mode=never
spring.sql.init.schema-locations=
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
